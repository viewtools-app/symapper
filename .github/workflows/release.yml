name: Release

on:
  push:
    tags: ['v*']
  # Manual run: check and build only (dry run); release and npm jobs need a tag push.
  workflow_dispatch:

permissions: {}
concurrency: release-${{ github.ref }}

jobs:
  check:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - id: version
        shell: bash
        env:
          TAG: ${{ github.ref_name }}
          EVENT: ${{ github.event_name }}
        run: |
          if [[ $EVENT == workflow_dispatch ]]; then
            TAG=v$(sed -n '/^\[package\]$/,/^\[/p' Cargo.toml |
              sed -n 's/^version *= *"\([^"]*\)".*/\1/p')
          fi
          version=${TAG#v}
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Use a plain vX.Y.Z release higher than the last published version; npm needs a dist-tag for prereleases and lower versions."
            exit 1
          fi
          cargo_version=$(sed -n '/^\[package\]$/,/^\[/p' Cargo.toml |
            sed -n 's/^version *= *"\([^"]*\)".*/\1/p')
          test "$version" = "$cargo_version"
          printf 'version=%s\n' "$version" >> "$GITHUB_OUTPUT"

  build:
    needs: check
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            target: aarch64-apple-darwin
          - os: macos-15
            target: x86_64-apple-darwin
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-musl
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
    runs-on: ${{ matrix.os }}
    env:
      TARGET: ${{ matrix.target }}
      VERSION: ${{ needs.check.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master 2026-11-16
        with:
          toolchain: stable
          targets: ${{ matrix.target }}
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - name: Check third-party licenses
        run: |
          cargo fetch --locked
          scripts/third-party-licenses.sh --check
      - name: Build binary
        shell: bash
        run: |
          if [[ "$RUNNER_OS" == Linux ]]; then
            export "CC_${TARGET//-/_}=musl-gcc"
          fi
          cargo build --release --locked --target "$TARGET"
      - name: Check binary
        shell: bash
        run: |
          binary="target/$TARGET/release/symapper"
          if [[ "$RUNNER_OS" == Linux ]]; then
            file "$binary" | grep static
          fi
          if [[ "$TARGET" != x86_64-apple-darwin ]]; then
            "$binary" --version
          fi
      - run: scripts/release-archive.sh "$TARGET" "target/$TARGET/release/symapper" "$VERSION" out
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bin-${{ matrix.target }}
          path: out/
          if-no-files-found: error

  release:
    if: github.event_name == 'push'
    needs: [check, build]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      TAG: ${{ github.ref_name }}
      VERSION: ${{ needs.check.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: bin-*
          path: artifacts
          merge-multiple: true
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          awk -v version="$VERSION" '
            /^## / {
              if (found) exit
              if ($2 == "[" version "]") found=1
              next
            }
            found { print }
            END { if (!found) exit 1 }
          ' CHANGELOG.md > notes.md
          cd artifacts
          sha256sum ./*.tar.gz > SHA256SUMS
          gh release create "$TAG" --verify-tag --title "symapper $VERSION" \
            --notes-file ../notes.md ./*.tar.gz SHA256SUMS

  npm:
    if: github.event_name == 'push'
    needs: [check, release]
    runs-on: ubuntu-24.04
    permissions:
      id-token: write
      contents: read
    env:
      VERSION: ${{ needs.check.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: bin-*
          path: artifacts
          merge-multiple: true
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - run: npm install -g npm@11.21.2
      - run: scripts/npm-stage.sh "$VERSION" artifacts/dist stage
      - run: scripts/npm-publish.sh stage
