[package]
name = "symapper"
version = "0.2.0"
edition = "2024"
rust-version = "1.90"
license = "Apache-2.0"
description = "Ranked, token-budgeted map of a git repo's code for coding agents"
publish = false
authors = ["ViewTools App"]
repository = "https://github.com/viewtools-app/symapper"
homepage = "https://symapper.viewtools.app/"
readme = "README.md"
keywords = ["code-map", "tree-sitter", "pagerank", "llm", "agents"]
categories = ["command-line-utilities", "development-tools"]
include = ["src/**", "queries/**", "README.md", "LICENSE", "NOTICE", "CHANGELOG.md"]

[dependencies]
tree-sitter = "=0.27.2"
tree-sitter-typescript = "=0.23.2"
tree-sitter-javascript = "=0.25.0"
tree-sitter-python = "=0.25.0"
tree-sitter-go = "=0.25.0"
tree-sitter-rust = "=0.24.2"
tree-sitter-swift = "=0.7.4"
rayon = "=1.12.0"
clap = { version = "=4.6.7", features = ["derive"] }
globset = "=0.4.21"

[dev-dependencies]
tempfile = "=3.27.0"
